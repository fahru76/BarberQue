name: One-time migration repair

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REPAIR to confirm you want to run this against production'
        required: true

jobs:
  repair:
    if: github.event.inputs.confirm == 'REPAIR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Revert stale remote migration versions
        run: |
          supabase migration repair --status reverted \
            20260831101137 20260831101153 20260831101217 20260831101437 \
            20260831174520 20260831175553 20260901115733 20260901123537 \
            20260901123659 20260902140444 20260902144119 20260902152308 \
            20260903131647 20260906002348 20260906123632 20260906130112 \
            20260907011927 20260908130435 20260908133450 20260908135827 \
            20260908143158 20260909133925 20260909134805 20260909141015 \
            20260909141037

      - name: Mark local migration versions as applied
        run: |
          supabase migration repair --status applied \
            20260901000000 20260901000100 20260901000200 20260901000300 \
            20260901000400 20260901000500 20260901000600 20260901000700 \
            20260901000800 20260902000900 20260902001000 20260902001100 \
            20260903000100 20260906001705 20260906123700 20260906130100 \
            20260907011800 20260908130000 20260908133500 20260908135754 \
            20260908143140 20260909133619 20260909134535 20260909141426 \
            20260909141439

      - name: Verify migration history now matches local files
        run: supabase migration list

# no-op: force GitHub to re-index this workflow_dispatch-only workflow (2026-09-15)
